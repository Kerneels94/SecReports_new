[build]
  command = "npm install && npm run build"
  publish = "out"
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Keep the browser on the Netlify origin so the backend's SameSite=Strict
# refresh cookie is first-party. Without this, cross-site refreshes 401.
# Security headers. The access token lives in localStorage, so limit where
# scripts load from and where data can be sent. 'unsafe-inline' is required:
# a static Next export inlines its bootstrap scripts and cannot use nonces.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/*"
  to = "https://secreports-new.onrender.com/:splat"
  status = 200
  force = true
