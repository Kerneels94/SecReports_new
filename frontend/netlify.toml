[build]
  command = "npm install && npm run build"
  publish = "out"
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Keep the browser on the Netlify origin so the backend's SameSite=Strict
# refresh cookie is first-party. Without this, cross-site refreshes 401.
# Security headers. Content-Security-Policy is NOT set here: scripts/csp-headers.js
# (npm postbuild) writes it per page into out/_headers with sha256 hashes of each
# page's inline scripts, so script-src needs no 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/*"
  to = "https://secreports-new.onrender.com/:splat"
  status = 200
  force = true
  # Adds an x-nf-sign JWS signed with the NETLIFY_PROXY_SECRET env var (set it in
  # Netlify AND Render). The backend then trusts x-nf-client-connection-ip as the
  # real client IP for rate limits and audit logs; unsigned requests can't spoof it.
  signed = "NETLIFY_PROXY_SECRET"
